services:

  mysql-service:

    image: mysql:8

    container_name: mysql-container

    restart: unless-stopped

    ports:
      - 3307:3306

    volumes:
      - mysql-volume:/var/lib/mysql
      - ./Database:/docker-entrypoint-initdb.d:ro

    environment:
      MYSQL_DATABASE: vacations
      MYSQL_ROOT_PASSWORD: xaxasxasxasdasdasdsadasdasdasdasdasd

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s



#------------------------------------

# List of all our named-volumes:
volumes:
  mysql-volume: