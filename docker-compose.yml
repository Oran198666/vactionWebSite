services:

  mysql-service:

    image: mysql:8

    container_name: mysql-container

    restart: unless-stopped

    ports:
      - 3307:3306

    volumes:
      - mysql-volume:/var/lib/mysql
      - ./Database:/docker-entrypoint-initdb.d:ro

    environment:
      MYSQL_DATABASE: vacations
      MYSQL_ROOT_PASSWORD: "rootUser1234"

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 10

  #---------------------------------------------------------------
  # Our backend service:
  backend-service:

    image: vacation-backend

    build: ./Backend

    container_name: vacation-backend-container

    ports:
      - 4000:4000

    restart: unless-stopped

    volumes:
      - ./Backend/src/1-assets:/app/src/1-assets

    env_file: ./Backend/.env
    environment:
      MYSQL_HOST: mysql-service
      MYSQL_PORT: 3306
      MYSQL_PASSWORD: "rootUser1234"

    depends_on:
      mysql-service:
        condition: service_healthy


#---------------------------------------------------------------
  # Our frontend service:
  frontend-service:
    image: vacation-frontend

    build: ./Frontend

    container_name: vacation-frontend-container

    ports:
      - 80:5173

    restart: unless-stopped

    depends_on:
      - backend-service



# List of all our named-volumes:
volumes:
  mysql-volume: